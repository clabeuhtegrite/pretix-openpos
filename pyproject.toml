[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretix-openpos"
dynamic = ["version"]
description = "Open-source point of sale for pretix, driven by a PWA cash register"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["pretix", "pos", "point-of-sale", "ticketing", "pwa"]
authors = [
    { name = "clabeuhtegrite", email = "82087430+clabeuhtegrite@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "flake8",
    # flake8 does not read pyproject.toml on its own, and without this it falls
    # back to its 79-column default and reports several hundred lines that are
    # perfectly fine. One config file beats two.
    "flake8-pyproject",
    "isort",
    "pytest",
    "pytest-django",
]

[project.urls]
Homepage = "https://github.com/clabeuhtegrite/pretix-openpos"
Issues = "https://github.com/clabeuhtegrite/pretix-openpos/issues"

# pretix discovers plugins through this entry point group. It only reads the
# module part of the value and appends it to INSTALLED_APPS; Django then picks
# up the AppConfig in pretix_openpos/apps.py.
[project.entry-points."pretix.plugin"]
pretix_openpos = "pretix_openpos:PretixPluginMeta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "pretix_openpos.__version__" }

[tool.setuptools.packages.find]
include = ["pretix_openpos*"]
namespaces = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
# The settings module is imported by pytest-django before collection puts
# anything on the path, so the repository root has to be there already —
# otherwise `pytest` works only when spelled `python -m pytest`.
pythonpath = ["."]
addopts = "--tb=short"

# pretix' own import style, spelled out rather than named. `profile = "pretix"`
# was here for a long time and is not a profile isort knows: it refuses to start
# at all on an unknown one, so the tree had never actually been sorted and the
# check in CI would have failed on its first run whatever the imports looked like.
[tool.isort]
combine_as_imports = true
default_section = "THIRDPARTY"
include_trailing_comma = true
known_first_party = ["pretix_openpos"]
multi_line_output = 5
use_parentheses = true
line_length = 118
skip = ["migrations"]

[tool.flake8]
max-line-length = 160
# Generated by Django and not ours to reformat.
exclude = ["pretix_openpos/migrations", ".git", "__pycache__", "build", "dist"]
