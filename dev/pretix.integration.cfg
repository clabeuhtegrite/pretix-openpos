; Configuration for the integration stack: the same pretix as the dev one, on
; PostgreSQL instead of SQLite.
;
; The engine is the whole point. PosSale.record() claims its sequence number
; optimistically and lets the unique constraint arbitrate, retrying inside a
; savepoint — a pattern SQLite forgives and PostgreSQL does not, where an
; IntegrityError poisons the surrounding transaction unless the savepoint is
; placed exactly right. Testing that anywhere but on PostgreSQL proves nothing
; about production.
[pretix]
instance_name=Open POS integration
url=http://localhost:8001
currency=EUR
datadir=/data
registration=False

[django]
secret=integration-only-insecure-secret-do-not-deploy
debug=False

[database]
backend=postgresql
name=pretix
user=pretix
password=pretix
host=db
port=5432

[mail]
from=openpos@localhost
