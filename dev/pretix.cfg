; Development configuration only. Do not reuse any of this in the homelab.
[pretix]
instance_name=Open POS dev
url=http://localhost:8000
currency=EUR
datadir=/data
registration=False

[django]
; Fixed so sessions survive a container rebuild. Worthless as a secret, which is
; fine because this file never leaves a laptop.
secret=dev-only-insecure-secret-do-not-deploy
; Deliberately off: pretix derives VITE_DEV_MODE from DEBUG, and in that mode it
; expects to proxy its own control-panel assets through a Vite dev server that
; only exists in a pretix source checkout. The PyPI package ships those assets
; pre-built, so DEBUG=False plus `runserver --insecure` is the combination that
; actually works. Plugin tracebacks still land in the container logs.
debug=False

[database]
backend=sqlite3
name=/data/db.sqlite3

[mail]
from=openpos@localhost
