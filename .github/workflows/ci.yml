# What a push must not break.
#
# Five jobs, and between them they cover everything that goes to production.
#
#   frontend      the till's own code, from integer-cent arithmetic to what a
#                 cashier can actually press, under a coverage floor
#   lint          style, on code neither tool has to import
#   backend       the plugin against a real pretix, over HTTP, under a
#                 coverage floor, plus "is there a migration for that model?"
#   integration   the same thing on PostgreSQL, in a whole running system:
#                 concurrent tills on one journal, the back-office pages, the
#                 arrivals histogram, the offline replay
#   image         the artifact that actually ships, built the way it ships
#
# The unit suites run on SQLite with pretix' own test settings and its
# migrations switched off — the schema is built straight from the models — which
# is what makes them fast. The integration job is where migrations, PostgreSQL
# and the savepoint handling are exercised for real.
#
# Everything that installs pretix installs the version the production image is
# built on, read out of deploy/Dockerfile: the backend job, and the two images in
# dev/ — the one the integration job boots, and the one preflight runs the suite
# in. A suite that installs whatever pretix released last week tests something
# production does not run, and the day the two differ is the day it passes for
# the wrong reason.
#
# publish-image.yml will not publish a commit until this workflow has passed on
# it, in the run for its push to main, and it finds that run by this file's
# name. Renaming the file, or dropping the push trigger, stops every release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the tree and nothing else: the images built here are built to
# be looked at, and pushed nowhere.
permissions:
  contents: read

jobs:
  frontend:
    name: "Frontend: typecheck, tests, build"
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for six hours, and hold
    # every release with it: publishing waits for this workflow to finish.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Every screen and every module, under the thresholds in vite.config.ts.
      # A component nobody tests shows up as the zero it is and fails the run.
      - run: npm run test:coverage
      # tsc -b runs first inside the build script, so this is the typecheck too.
      - run: npm run build

  lint:
    name: "Backend: lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Neither tool imports the code, so neither needs pretix installed.
      - run: pip install flake8 flake8-pyproject isort
      - run: flake8 pretix_openpos tests
      - run: isort --check-only --diff pretix_openpos tests

  backend:
    name: "Backend: tests (Python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    # libsass is compiled from source on a cold pip cache, which is most of
    # the time this job can take.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor the package claims, and the version the production image
        # actually runs. Claiming a floor without testing it is how it stops
        # being true.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # deploy/Dockerfile too, because it decides which pretix is
          # installed. Keyed on pyproject.toml alone, a pretix bump would
          # restore the cache made for the old one and never save a new one,
          # so every run would download what changed, and compile it when it
          # is libsass, until pyproject.toml next moved.
          cache-dependency-path: |
            pyproject.toml
            deploy/Dockerfile
      # Named rather than assumed to be on the runner: libsass, which pretix
      # pulls in, publishes no wheel for either version here and is compiled
      # from source. The first run pays for that; later ones take the built
      # wheel from the pip cache above.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential gettext
      # The pretix production runs, read out of the production Dockerfile so
      # the two cannot drift apart (see the top of this file). `2026.7.*`
      # rather than `2026.7`: pip reads the latter as 2026.7.0 exactly, while
      # the image's tag follows that release's patches.
      - name: Install pretix, the version the production image is built on
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG PRETIX_VERSION=\(.*\)$/\1/p' deploy/Dockerfile)
          [ -n "$version" ] || { echo "::error::no ARG PRETIX_VERSION in deploy/Dockerfile"; exit 1; }
          pip install "pretix==$version.*"
      # --no-deps: the plugin declares no runtime dependencies of its own, and
      # letting pip resolve again here risks pulling a different pretix.
      - run: pip install --no-deps -e . && pip install "pytest<9" pytest-django pytest-cov
      # The plugin's own migrations are the ones that matter, since the suite
      # builds the schema from the models: this is what catches a model changed
      # without one.
      - run: python -m django makemigrations --check --dry-run pretix_openpos
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_migrations
      # --cov with no argument reads [tool.coverage.run] from pyproject.toml,
      # including the floor the run fails under.
      - run: pytest --cov

  integration:
    name: "End to end: PostgreSQL, concurrency, back office"
    runs-on: ubuntu-latest
    # Building pretix from source and replaying its whole migration history
    # takes minutes; failing the job at ten is better than hanging for six
    # hours on a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Boots the stack, seeds it, and runs every script in dev/ against it.
      # The same command that is run by hand on a laptop.
      - run: dev/integration.sh
      - name: Container logs, if it did not pass
        if: failure()
        run: docker compose -f dev/compose.integration.yml logs --tail=200

  image:
    name: "Production image builds"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Not pushed anywhere: the point is that it builds at all. Two things in
      # here fail nowhere else — the PWA bundle, which the image builds from
      # this tree, and `pretix rebuild`, which does not fail the build when it
      # is skipped but leaves the till 500ing on its own JavaScript.
      - run: docker build --platform linux/amd64 -f deploy/Dockerfile -t pretix-openpos:ci .
      # Prove the bundle is in there and collected, rather than assuming the
      # COPY landed where the template looks for it.
      - name: The till's own JavaScript is in the image
        run: |
          docker run --rm --entrypoint sh pretix-openpos:ci -c \
            'ls /pretix/src/pretix/static.dist/pretix_openpos/pwa/app.js'
